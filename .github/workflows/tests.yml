# Validates the tap on every push: `brew style` (the linter that caught two
# correctable offences in the cask) plus `brew readall`, which proves the tap
# parses for every OS and arch.
#
# The macOS job from `brew tap-new`'s template was dropped: it ran the same two
# checks, and on this account it sat queued for minutes without ever starting.
# Installing the cask itself is validated where it matters — `scripts/release.sh`
# signs, notarizes, staples and checks the DMG with spctl before publishing.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: linux-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: linux-rubygems-

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
